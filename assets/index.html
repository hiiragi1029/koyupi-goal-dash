<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#6dc7ff">
<title>こゆぴのゴールダッシュ</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#80d4ff;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;touch-action:none}
  #wrap{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#74cdfc,#dff5ff);overflow:hidden}
  canvas{
    display:block;
    width:min(100vw,calc(100vh * 16 / 9));
    height:min(100vh,calc(100vw * 9 / 16));
    aspect-ratio:16/9;
    background:#8ed8ff;
    box-shadow:0 0 30px #0002;
  }
  #hud{position:fixed;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:900;text-shadow:0 2px 4px #245;pointer-events:none;font-size:clamp(15px,3vw,22px)}
  #controls{position:fixed;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
  .group{display:flex;gap:12px;pointer-events:auto}
  button.ctrl{width:70px;height:70px;border:0;border-radius:50%;background:#ffffffbb;color:#174d70;font-size:30px;font-weight:900;box-shadow:0 5px 0 #7bb0ca,0 8px 18px #0004;user-select:none}
  button.ctrl:active{transform:translateY(4px);box-shadow:0 1px 0 #7bb0ca}
  #jump{width:84px;height:84px;background:#ffe76fdd;color:#724c00}
  #overlay{position:fixed;inset:0;display:grid;place-items:center;background:#1238;backdrop-filter:blur(4px);padding:20px}
  .card{width:min(92vw,520px);padding:24px;text-align:center;border-radius:24px;background:#fff;color:#17384d;box-shadow:0 18px 60px #0005}
  h1{margin:0 0 10px;font-size:clamp(28px,7vw,46px)}
  p{line-height:1.7;margin:8px 0 18px}
  #start{border:0;border-radius:999px;padding:14px 30px;background:#ff744e;color:#fff;font-size:20px;font-weight:900;box-shadow:0 6px 0 #ba3d25}
  #start:active{transform:translateY(4px);box-shadow:0 2px 0 #ba3d25}
  .small{font-size:13px;opacity:.7}
  @media (min-width:900px){button.ctrl{width:76px;height:76px}#controls{max-width:1050px;margin:auto}}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="hud"><span id="status">❤❤❤</span><span id="distance">GOAL 100%</span></div>
<div id="controls">
  <div class="group"><button class="ctrl" id="left" aria-label="左">◀</button><button class="ctrl" id="right" aria-label="右">▶</button></div>
  <div class="group"><button class="ctrl" id="jump" aria-label="ジャンプ">↑</button></div>
</div>
<div id="overlay"><div class="card"><h1 id="title">こゆぴの<br>ゴールダッシュ</h1><p id="message">敵をよけて旗を取ろう！<br>旗の先ではボス戦。跳ねるボスを穴へ落とせば勝ち！</p><button id="start">スタート</button><p class="small">パソコン：← → / A D、ジャンプ：Space<br>スマホでも画面サイズに関係なく同じプレイ範囲を表示します。</p></div></div>
<script>
(() => {
  const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay'), titleEl = document.getElementById('title'), msgEl = document.getElementById('message'), startBtn = document.getElementById('start');
  const statusEl = document.getElementById('status'), distEl = document.getElementById('distance');
  // 固定の仮想プレイ画面。端末サイズに関係なくゲーム内座標は変わらない。
  const W=960,H=540;
  let ground=425;
  function resize(){
    const dpr=Math.min(devicePixelRatio||1,2);
    canvas.width=W*dpr;
    canvas.height=H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize',resize);
  resize();

  const load = src => new Promise(resolve=>{
    const img = new Image();
    img.onload = () => resolve({ok:true,img,src});
    img.onerror = () => resolve({ok:false,img:null,src});
    img.src = src + '?v=6';
  });
  let heroImgs=[], enemyImgs=[], assetMessage='画像を読み込み中…';
  let final10Img=null;
  Promise.all([
    ...[0,1,2,3,4].map(i=>load(`assets/hero_${i}.png`)),
    ...[1,2,3].map(i=>load(`assets/enemy_${i}.png`)),
    load('assets/final_10.png')
  ]).then(results=>{
    heroImgs = results.slice(0,5).map(r=>r.img);
    enemyImgs = results.slice(5,8).map(r=>r.img);
    final10Img = results[8].img;
    const failed = results.filter(r=>!r.ok).map(r=>r.src);
    assetMessage = failed.length ? '未読込: ' + failed.join(', ') : '画像読込OK';
    console.log(assetMessage);
    draw();
  });

  // ボス戦前演出用の2枚の画像はHTML内に埋め込み済み
  const bossIntroImg1 = new Image();
  bossIntroImg1.src = 'assets/boss_intro_1.png?v=2';
  const bossIntroImg2 = new Image();
  bossIntroImg2.src = 'assets/boss_intro_2.png?v=2';

  const bossSpriteImg = new Image();
  bossSpriteImg.src = 'assets/boss_sprite.webp?v=2';
  const bossWalkFrames=[];
  for(let n=0;n<6;n++){
    const img=new Image();
    img.src=`assets/boss_walk_${n}.png?v=2`;
    bossWalkFrames.push(img);
  }

  const keys={left:false,right:false,jump:false};
  const bind=(id,key)=>{const b=document.getElementById(id); ['pointerdown','touchstart'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[key]=true;if(key==='jump')tryJump();},{passive:false})); ['pointerup','pointercancel','pointerleave','touchend'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[key]=false},{passive:false}));};
  bind('left','left');bind('right','right');bind('jump','jump');
  addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=true;if(['ArrowRight','d','D'].includes(e.key))keys.right=true;if([' ','ArrowUp','w','W'].includes(e.key)){e.preventDefault();keys.jump=true;tryJump();}});
  addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false;if([' ','ArrowUp','w','W'].includes(e.key))keys.jump=false;});

  let running=false,last=0,worldX=0,playerWorldX=130,goalX=3600,lives=3,inv=0,spawnTimer=0,enemies=[],particles=[],clouds=[];
  let final10Shown=false;
  let bossIntroPlayed=false, cutsceneActive=false, cutsceneTimer=0;
  let phase='run'; // run -> intro -> boss -> clear/gameover
  let flagTaken=false;
  const bossArena={left:-3400,right:3400,holeW:190};
  let bossCameraX=0;
  let bossRightTravel=0, bossLeftTravel=0;
  let rightPitActive=false, leftPitActive=false;
  let rightHoleX=0, leftHoleX=0;
  const pitTriggerDistance=1650;
  const boss={
    x:650,y:0,w:170,h:170,vx:-95,vy:0,onGround:false,jumpTimer:1.6,alive:true,
    motion:'walk', motionT:0, landT:0, walkT:0, airChaseCooldown:0
  };
  const hero={x:130,y:0,w:78,h:118,vx:0,vy:0,onGround:false,frame:0,face:1};
  function reset(){
    worldX=0;playerWorldX=130;lives=3;inv=0;spawnTimer=0;enemies=[];particles=[];final10Shown=false;
    bossIntroPlayed=false;cutsceneActive=false;cutsceneTimer=0;phase='run';flagTaken=false;
    hero.x=130;hero.y=ground-hero.h;hero.vx=hero.vy=0;hero.onGround=true;
    bossCameraX=0;bossRightTravel=0;bossLeftTravel=0;
    rightPitActive=false;leftPitActive=false;rightHoleX=0;leftHoleX=0;
    boss.x=650;boss.y=ground-boss.h;boss.vx=-95;boss.vy=0;boss.onGround=true;boss.jumpTimer=1.35;boss.alive=true;
    boss.motion='walk';boss.motionT=0;boss.landT=0;boss.walkT=0;boss.airChaseCooldown=0;
    statusEl.textContent='❤❤❤';distEl.textContent='FLAG 100%';
    clouds=Array.from({length:10},(_,i)=>({x:i*380+Math.random()*180,y:40+Math.random()*180,s:.7+Math.random()}));
  }
  function tryJump(){if(running&&hero.onGround){hero.vy=-1140;hero.onGround=false;burst(hero.x+hero.w/2,hero.y+hero.h,8);}}
  function start(){reset();spawnTimer=.2;overlay.style.display='none';running=true;last=performance.now();requestAnimationFrame(loop)}
  startBtn.onclick=start;

  function startBossIntro(){
    cutsceneActive=true;
    cutsceneTimer=0;
    bossIntroPlayed=true;
    phase='intro';
    keys.left=false; keys.right=false; keys.jump=false;
  }
  function startBossBattle(){
    cutsceneActive=false;
    phase='boss';
    enemies=[];
    hero.x=0; hero.y=ground-hero.h; hero.vx=0; hero.vy=0; hero.onGround=true;
    bossCameraX=hero.x+hero.w/2-W/2;
    bossRightTravel=0;bossLeftTravel=0;
    rightPitActive=false;leftPitActive=false;rightHoleX=0;leftHoleX=0;
    boss.x=650; boss.y=ground-boss.h; boss.vx=-95; boss.vy=0; boss.onGround=true; boss.jumpTimer=1.25; boss.alive=true;
    boss.motion='walk';boss.motionT=0;boss.landT=0;boss.walkT=0;boss.airChaseCooldown=0;
    distEl.textContent='BOSS';
  }
  function updateBossIntro(dt){
    cutsceneTimer+=dt;
    if(cutsceneTimer>=2.8){
      startBossBattle();
    }
  }
  function drawBossImage(img, zoom, shake){
    if(!img || !img.complete) return;
    const maxW=W*0.78, maxH=H*0.72;
    const base=Math.min(maxW/img.width, maxH/img.height);
    const scale=base*zoom;
    const iw=img.width*scale, ih=img.height*scale;
    const ox=(Math.random()-.5)*shake;
    const oy=(Math.random()-.5)*shake;
    ctx.drawImage(img, (W-iw)/2+ox, (H-ih)/2+oy, iw, ih);
  }
  function drawBossIntro(){
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,.58)';
    ctx.fillRect(0,0,W,H);

    if(cutsceneTimer<1.2){
      drawBossImage(bossIntroImg1, 1.0, 18);
    }else{
      const p=Math.min(1,(cutsceneTimer-1.2)/1.6);
      const flash=Math.max(0,1-Math.abs(cutsceneTimer-1.2)/0.10);
      if(flash>0){
        ctx.fillStyle='rgba(255,255,255,' + (flash*.75) + ')';
        ctx.fillRect(0,0,W,H);
      }
      drawBossImage(bossIntroImg2, 0.42 + p*0.88, 22);
    }

    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillStyle='rgba(0,0,0,.78)';
    ctx.fillRect(W/2-170, H-96, 340, 54);
    ctx.fillStyle='#fff';
    ctx.font='900 28px sans-serif';
    ctx.fillText('こゆぴー乱入！！！', W/2, H-69);
    ctx.restore();
  }

  function burst(x,y,n){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*180,vy:-Math.random()*160,life:.5+Math.random()*.4,r:3+Math.random()*5})}
  function spawn(){
    const type=Math.floor(Math.random()*3);
    // 敵を従来より約35%大型化
    const size=type===0?136:128;
    // 大型化に合わせて移動速度を少し下げる
    enemies.push({
      x:W+100,
      y:type===1 ? ground-size-150 : ground-size-4,
      w:size*.72,
      h:size,
      vx:-(185+Math.random()*95),
      type,
      phase:Math.random()*6.28,
      baseY:type===1 ? ground-size-150 : ground-size-4
    });
  }
  function hit(a,b){
    // 見た目より少し小さい当たり判定にして回避可能性を保つ
    const bx=b.x+b.w*.14, by=b.y+b.h*.10;
    const bw=b.w*.72, bh=b.h*.82;
    return a.x+14<bx+bw&&a.x+a.w-14>bx&&a.y+12<by+bh&&a.y+a.h-8>by;
  }
  function end(win){
    running=false;
    phase=win?'clear':'gameover';
    overlay.style.display='grid';
    titleEl.innerHTML=win?'ボス撃破！🎉':'ゲームオーバー';
    msgEl.innerHTML=win?'ボスを穴に落としました！':'穴に落ちるか、ボスにやられてしまいました。<br>もう一度チャレンジ！';
    startBtn.textContent=win?'もう一度':'リトライ';
  }
  function update(dt){
    let dir=(keys.right?1:0)-(keys.left?1:0); hero.vx += dir*1500*dt; hero.vx*=Math.pow(.0008,dt); hero.vx=Math.max(-260,Math.min(360,hero.vx));
    hero.face=dir!==0?dir:hero.face; hero.vy+=1900*dt; hero.y+=hero.vy*dt;
    if(hero.y+hero.h>=ground){hero.y=ground-hero.h;hero.vy=0;hero.onGround=true}
    if(hero.y<10){hero.y=10;hero.vy=0}
    // 横スクロール区間はプレイヤーのワールド座標を独立して保持する。
    const prevWorldX=worldX;
    playerWorldX += hero.vx*dt;
    playerWorldX = Math.max(20, Math.min(goalX+120, playerWorldX));

    // 画面中央寄りまで進んだらカメラが追従。左へ戻れば旗はワールド上の固定位置に残る。
    const desiredRunCamera=Math.max(0, playerWorldX-W*.42);
    worldX += (desiredRunCamera-worldX)*Math.min(1,dt*12);
    hero.x=playerWorldX-worldX;
    hero.x=Math.max(20,Math.min(W*.42,hero.x));

    const cameraAdvance=worldX-prevWorldX;
    const advance=Math.max(0,cameraAdvance);
    hero.frame += (Math.abs(hero.vx)>30&&hero.onGround?dt*10:dt*2);
    spawnTimer-=dt;
    if(spawnTimer<=0&&worldX<goalX-700){
      spawn();
      // 大型化に合わせて敵同士の間隔を広げる
      spawnTimer=Math.max(.95,1.75-worldX/11000)+Math.random()*.65;
    }
    for(const e of enemies){
      e.x+=e.vx*dt-advance*.68;
      e.phase+=dt*(e.type===1 ? 4.4 : 2.65);
      // enemy_2 は空中を速く大きく上下移動する
      if(e.type===1)e.y=e.baseY+Math.sin(e.phase)*88;
      if(e.type===2)e.y=e.baseY+Math.sin(e.phase)*22;
    }
    enemies=enemies.filter(e=>e.x>-160);
    if(inv>0)inv-=dt;
    for(const e of enemies){if(inv<=0&&hit(hero,e)){lives--;inv=1.65;hero.vy=-500;hero.vx=-210;burst(hero.x+hero.w/2,hero.y+hero.h/2,18);navigator.vibrate?.(100);statusEl.textContent='❤'.repeat(lives)+'♡'.repeat(3-lives);if(lives<=0){end(false);return}}}
    for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=480*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);
    const remainingPct=(goalX-playerWorldX)/goalX*100;
    distEl.textContent='FLAG '+Math.max(0,Math.ceil(remainingPct))+'%';
    if(playerWorldX>=goalX && !flagTaken){
      flagTaken=true;
      startBossIntro();
      return;
    }
  }

  function updateBoss(dt){
    let dir=(keys.right?1:0)-(keys.left?1:0);
    hero.vx += dir*1500*dt;
    hero.vx*=Math.pow(.0008,dt);
    hero.vx=Math.max(-300,Math.min(300,hero.vx));
    hero.face=dir!==0?dir:hero.face;
    hero.vy+=1900*dt;

    const prevHeroX=hero.x;
    hero.x+=hero.vx*dt;
    hero.y+=hero.vy*dt;

    if(hero.x<bossArena.left) hero.x=bossArena.left;
    if(hero.x+hero.w>bossArena.right) hero.x=bossArena.right-hero.w;

    // 右へ歩いた距離と左へ歩いた距離を別々に計測
    const dx=hero.x-prevHeroX;
    if(dx>0) bossRightTravel+=dx;
    if(dx<0) bossLeftTravel+=-dx;

    // 右方向で一定距離歩いたら右側に1つだけ穴
    if(!rightPitActive && bossRightTravel>=pitTriggerDistance){
      rightPitActive=true;
      rightHoleX=Math.min(bossArena.right-bossArena.holeW-220, hero.x+760);
    }
    // 左方向で一定距離歩いたら左側に1つだけ穴
    if(!leftPitActive && bossLeftTravel>=pitTriggerDistance){
      leftPitActive=true;
      leftHoleX=Math.max(bossArena.left+220, hero.x-760);
    }

    const heroCenter=hero.x+hero.w/2;
    const overRightPit=rightPitActive && heroCenter>rightHoleX && heroCenter<rightHoleX+bossArena.holeW;
    const overLeftPit=leftPitActive && heroCenter>leftHoleX && heroCenter<leftHoleX+bossArena.holeW;
    const overHole=overRightPit||overLeftPit;

    if(hero.y+hero.h>=ground && !overHole){
      hero.y=ground-hero.h;hero.vy=0;hero.onGround=true;
    }else if(overHole && hero.y+hero.h>=ground){
      hero.onGround=false;
    }
    if(hero.y>H+100){end(false);return;}

    hero.frame += (Math.abs(hero.vx)>30&&hero.onGround?dt*10:dt*2);

    // 主人公を中心に左右へスクロール
    const desiredCamera=hero.x+hero.w/2-W/2;
    const minCam=bossArena.left-80;
    const maxCam=bossArena.right-W+80;
    bossCameraX += (Math.max(minCam,Math.min(maxCam,desiredCamera))-bossCameraX)*Math.min(1,dt*10);

    if(boss.alive){
      boss.walkT+=dt;

      if(boss.motion==='walk'){
        boss.jumpTimer-=dt;

        // 地上にいる時だけ主人公の方向へ向きを変更。
        // プレイヤーの最大地上速度と同じ300px/s。
        const toward=hero.x<boss.x?-1:1;
        const BOSS_WALK_SPEED=300;
        boss.vx=toward*BOSS_WALK_SPEED;

        if(boss.onGround && boss.jumpTimer<=0){
          boss.motion='charge';
          boss.motionT=0;
          boss.vx=0;
        }
      }else if(boss.motion==='charge'){
        boss.motionT+=dt;
        boss.vx=0;
        if(boss.motionT>=0.72){
          boss.motion='air';
          boss.motionT=0;
          boss.onGround=false;
          boss.vy=-(1030+Math.random()*150);

          // 離陸した瞬間の方向を固定。空中では方向転換しない。
          const toward=hero.x<boss.x?-1:1;
          boss.vx=toward*(150+Math.random()*35);
        }
      }
      // air中はboss.vxを変更しない

      boss.vy+=1750*dt;
      boss.x+=boss.vx*dt;
      boss.y+=boss.vy*dt;

      if(boss.x<bossArena.left){boss.x=bossArena.left;boss.vx=Math.abs(boss.vx)}
      if(boss.x+boss.w>bossArena.right){boss.x=bossArena.right-boss.w;boss.vx=-Math.abs(boss.vx)}

      const bossCenter=boss.x+boss.w/2;
      const bossOverRight=rightPitActive && bossCenter>rightHoleX && bossCenter<rightHoleX+bossArena.holeW;
      const bossOverLeft=leftPitActive && bossCenter>leftHoleX && bossCenter<leftHoleX+bossArena.holeW;
      const bossOverHole=bossOverRight||bossOverLeft;

      if(boss.y+boss.h>=ground && !bossOverHole){
        const wasAir=!boss.onGround || boss.motion==='air';
        boss.y=ground-boss.h;boss.vy=0;boss.onGround=true;

        if(wasAir){
          boss.motion='land';
          boss.landT=0;
          boss.jumpTimer=1.45+Math.random()*.55;
        }
      }else if(bossOverHole && boss.y+boss.h>=ground){
        boss.onGround=false;
      }

      if(boss.motion==='land'){
        boss.landT+=dt;
        boss.vx=0;
        if(boss.landT>=0.30){
          boss.motion='walk';
          boss.motionT=0;
        }
      }

      if(boss.y>H+120){
        boss.alive=false;
        end(true);
        return;
      }

      if(inv<=0){
        const safeBoss={
          x:boss.x+boss.w*.16,
          y:boss.y+boss.h*.12,
          w:boss.w*.68,
          h:boss.h*.78
        };
        if(hit(hero,safeBoss)){
          lives--;
          inv=1.75;
          hero.vy=-520;
          hero.vx=hero.x<boss.x?-245:245;
          statusEl.textContent='❤'.repeat(lives)+'♡'.repeat(3-lives);
          if(lives<=0){end(false);return;}
        }
      }
    }
    if(inv>0)inv-=dt;
  }

  function drawCloud(x,y,s){ctx.save();ctx.globalAlpha=.75;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,25*s,0,7);ctx.arc(x+28*s,y-12*s,32*s,0,7);ctx.arc(x+62*s,y,25*s,0,7);ctx.fill();ctx.restore()}
  function draw(){
    ctx.clearRect(0,0,W,H);
    const sky=ctx.createLinearGradient(0,0,0,ground);sky.addColorStop(0,'#66c8ff');sky.addColorStop(1,'#d9f3ff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
    for(const c of clouds)drawCloud(((c.x-worldX*.12)%(W+500)+W+500)%(W+500)-180,c.y,c.s);
    ctx.fillStyle='#8bd56b';for(let i=-1;i<8;i++){let x=i*220-(worldX*.22%220);ctx.beginPath();ctx.arc(x+100,ground+35,145,Math.PI,0);ctx.fill()}
    ctx.fillStyle='#52a94f';for(let i=-1;i<10;i++){let x=i*150-(worldX*.38%150);ctx.beginPath();ctx.arc(x+60,ground+55,100,Math.PI,0);ctx.fill()}
    ctx.fillStyle='#65bf55';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#8b5a2b';ctx.fillRect(0,ground+24,W,H-ground-24);
    ctx.fillStyle='#b7793c';for(let x=-(worldX%60);x<W;x+=60)ctx.fillRect(x,ground+32,38,12);
    if(phase==='run'){
      // 旗はワールド座標 goalX に固定。
      // プレイヤーの画面内X座標とは無関係に、スクロール量だけで位置が決まる。
      const goalScreen=goalX-worldX;
      if(goalScreen>-120 && goalScreen<W+150){
        ctx.fillStyle='#eee';ctx.fillRect(goalScreen,ground-210,12,210);
        ctx.fillStyle='#ff4a4a';ctx.beginPath();ctx.moveTo(goalScreen+12,ground-205);ctx.lineTo(goalScreen+95,ground-172);ctx.lineTo(goalScreen+12,ground-140);ctx.fill();
        ctx.fillStyle='#17384d';ctx.font='900 22px sans-serif';ctx.fillText('FLAG',goalScreen+20,ground-165);
      }
    }else if(phase==='boss' || phase==='intro'){
      // 横長のボス専用ステージ。穴は右へ進んだ先にある。
      ctx.fillStyle='#65bf55';ctx.fillRect(0,ground,W,H-ground);
      ctx.fillStyle='#8b5a2b';ctx.fillRect(0,ground+24,W,H-ground-24);
      const drawPit=(holeX)=>{
        const sx=holeX-bossCameraX;
        if(sx<W+80 && sx+bossArena.holeW>-80){
          ctx.fillStyle='#111';
          ctx.fillRect(sx,ground-2,bossArena.holeW,H-ground+4);
        }
      };
      if(leftPitActive)drawPit(leftHoleX);
      if(rightPitActive)drawPit(rightHoleX);
      ctx.fillStyle='#fff';ctx.font='900 22px sans-serif';ctx.fillText('BOSS',24,44);
      if(phase==='boss'){
        ctx.font='700 16px sans-serif';
        const remainL=Math.max(0,Math.ceil(pitTriggerDistance-bossLeftTravel));
        const remainR=Math.max(0,Math.ceil(pitTriggerDistance-bossRightTravel));
        if(!leftPitActive || !rightPitActive){
          ctx.fillText('左の穴 '+(leftPitActive?'出現済':remainL)+'　右の穴 '+(rightPitActive?'出現済':remainR),24,70);
        }else{
          ctx.fillText('左右に穴が出現！ ボスを誘導して落とそう！',24,70);
        }
      }
    }
    for(const e of enemies){
      const img=enemyImgs[e.type];
      if(img){
        ctx.drawImage(img,e.x,e.y,e.w,e.h);
      }else{
        ctx.fillStyle=['#2770d8','#e24a3b','#4a65b8'][e.type];
        ctx.fillRect(e.x,e.y,e.w,e.h);
        ctx.fillStyle='#fff';
        ctx.font='900 14px sans-serif';
        ctx.fillText('ENEMY',e.x+6,e.y+e.h/2);
      }
    }
    if(phase==='boss' && boss.alive){
      const sx=boss.x-bossCameraX+boss.w/2;
      const sy=boss.y+boss.h/2;
      let scaleX=1, scaleY=1, rot=0, bob=0;

      if(boss.motion==='walk'){
        // 添付動画の歩き方を参考にした歩行モーション：
        // 左右の大きな歩幅、接地ごとの上下動、少し前後へ揺れるリズム。
        const step=Math.sin(boss.walkT*7.2);
        const contact=Math.abs(Math.sin(boss.walkT*7.2));
        bob=-contact*8;
        rot=step*0.055;
        scaleY=1+contact*0.035;
        scaleX=1-contact*0.025;

        // 歩行方向へわずかに前傾させる
        const facing=boss.vx<0?-1:1;
        rot += facing*0.025;
      }else if(boss.motion==='charge'){
        const p=Math.min(1,boss.motionT/.72);
        // ジャンプ前に大きくしゃがむ。黄色い予告リングも表示
        scaleY=1-0.24*p;
        scaleX=1+0.18*p;
        bob=18*p;

        ctx.save();
        ctx.globalAlpha=.35+.25*Math.sin(boss.motionT*20);
        ctx.strokeStyle='#ffe45c';
        ctx.lineWidth=8;
        ctx.beginPath();
        ctx.ellipse(sx,ground-8,75+18*p,20+5*p,0,0,Math.PI*2);
        ctx.stroke();
        ctx.restore();

      }else if(boss.motion==='air'){
        // ジャンプ専用画像は立ち姿に近いので、変形を控えめにして違和感を減らす。
        if(boss.vy<0){scaleY=1.035;scaleX=.985}
        else{scaleY=.995;scaleX=1.015}
        rot=Math.max(-.045,Math.min(.045,boss.vx/2600));
      }else if(boss.motion==='land'){
        const p=Math.min(1,boss.landT/.30);
        const squash=Math.sin(p*Math.PI);
        scaleY=1-.22*squash;
        scaleX=1+.17*squash;
        bob=12*squash;
      }

      ctx.save();
      ctx.translate(sx,sy+bob);
      ctx.rotate(rot);
      ctx.scale(scaleX,scaleY);
      let img=(bossSpriteImg && bossSpriteImg.complete)?bossSpriteImg:bossIntroImg2;
      let strideX=0;

      if(boss.motion==='walk' && bossWalkFrames.length){
        // 地上歩行は動画から抽出した複数フレーム
        const frameIndex=Math.floor(boss.walkT*10)%bossWalkFrames.length;
        const candidate=bossWalkFrames[frameIndex];
        if(candidate && candidate.complete)img=candidate;
        strideX=Math.sin(boss.walkT*7.2)*3;
      }else{
        // 溜め・空中・着地は今回指定された boss_sprite.webp を使用
        img=(bossSpriteImg && bossSpriteImg.complete)?bossSpriteImg:bossIntroImg2;
      }

      if(img && img.complete){
        ctx.drawImage(img,-boss.w/2+strideX,-boss.h/2,boss.w,boss.h);
      }else{
        ctx.fillStyle='#8b1e1e';ctx.fillRect(-boss.w/2,-boss.h/2,boss.w,boss.h);
        ctx.fillStyle='#fff';ctx.font='900 22px sans-serif';ctx.fillText('BOSS',-35,8);
      }
      ctx.restore();
    }
    {
      const idx=hero.onGround?(Math.floor(hero.frame)%5):4;
      const img=heroImgs[idx];
      ctx.save();
      if(inv>0&&Math.floor(inv*12)%2===0)ctx.globalAlpha=.3;
      const heroScreenX=phase==='boss'?hero.x-bossCameraX:hero.x;
      if(hero.face<0){ctx.translate(heroScreenX*2+hero.w,0);ctx.scale(-1,1)}
      const heroDrawX=phase==='boss'?hero.x-bossCameraX:hero.x;
      if(img){
        ctx.drawImage(img,heroDrawX,hero.y,hero.w,hero.h);
      }else{
        ctx.fillStyle='#ffd94f';
        ctx.fillRect(heroDrawX,hero.y,hero.w,hero.h);
        ctx.fillStyle='#17384d';
        ctx.font='900 17px sans-serif';
        ctx.fillText('HERO',heroDrawX+12,hero.y+hero.h/2);
      }
      ctx.restore();
    }
for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1;
  }
  function loop(t){
    if(!running)return;
    const dt=Math.min(.032,(t-last)/1000);
    last=t;
    if(phase==='intro' || cutsceneActive){
      updateBossIntro(dt);
      draw();
      drawBossIntro();
    }else if(phase==='boss'){
      updateBoss(dt);
      draw();
    }else{
      update(dt);
      draw();
    }
    if(running)requestAnimationFrame(loop)
  }
  reset();draw();
})();
</script>
</body>
